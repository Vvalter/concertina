<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hänschen klein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Music&display=swap" rel="stylesheet">
<link rel="stylesheet" href="concertina.css?v=V5">
<style>
  a.back { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
  .controls input[type=range] { width: 9em; accent-color: var(--accent); }
  .tempo-value { font-variant-numeric: tabular-nums; min-width: 4.5em; }
  svg.score { width: 100%; height: auto; display: block; }
  .score .l { stroke: var(--ink); stroke-width: 1.1; }
  .score .bar { stroke: var(--ink); stroke-width: 1.4; }
  .score .glyph { fill: var(--ink); font-family: "Noto Music", "Bravura", "Segoe UI Symbol", "Apple Symbols", serif; }
  .score .meter { fill: var(--ink); font: 700 19px system-ui, sans-serif; text-anchor: middle; }
  .score .note { cursor: pointer; }
  .score .note .hit { fill: transparent; }
  .score .note .head { stroke: var(--ink); stroke-width: 1.6; }
  .score .note .head.filled { fill: var(--ink); }
  .score .note .head.open { fill: none; }
  .score .note .stem, .score .note .ledger { stroke: var(--ink); stroke-width: 1.3; }
  .score .note .lyric { fill: var(--muted); font: 13px system-ui, sans-serif; text-anchor: middle; }
  .score .note.now .head { stroke: var(--accent); }
  .score .note.now .head.filled { fill: var(--accent); }
  .score .note.now .stem, .score .note.now .ledger { stroke: var(--accent); }
  .score .note.now .lyric { fill: var(--accent); font-weight: 700; }
  .score .note:hover .head { stroke: var(--accent); }
  .now-line { display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; margin: 0 0 10px; }
  .now-note { font-size: 2.4rem; font-weight: 700; min-width: 2.5em; }
  .now-note .acc { font-family: "Noto Music", system-ui, sans-serif; }
  .next-note { color: var(--muted); }
  .card h2 { font-size: 1rem; margin: 0 0 4px; font-weight: 600; }
  .card .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 12px; }
  .status { color: var(--muted); font-size: 0.9rem; min-height: 1.3em; }
  /* On phones the keyboard stays in view at the bottom while the music scrolls behind it */
  @media (max-width: 560px) {
    .keys { position: sticky; bottom: 0; padding: 10px 12px; box-shadow: 0 -6px 16px rgba(0, 0, 0, 0.12); }
    .keys .sub { display: none; }
    .keys .now-line { margin: 0 0 4px; }
    .now-note { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <a class="back" href="index.html">← Note Listener</a> · <a class="back" href="duet.html">Duett-Fassung</a>
      <h1 id="title">Hänschen klein</h1>
    </div>
    <div class="controls">
      <label>Tempo <input id="tempo" type="range" min="50" max="160" step="5" value="100">
        <span class="tempo-value" id="tempoValue">100 bpm</span></label>
      <button id="play" class="start">▶ Play</button>
    </div>
  </header>

  <section class="card">
    <svg class="score" id="score" aria-label="Melody"></svg>
  </section>

  <section class="card keys">
    <div class="now-line">
      <div class="now-note" id="nowNote">–</div>
      <div class="next-note" id="nextNote"></div>
    </div>
    <p class="sub">The button to press is filled, the next one is dashed. Click a note in the music to start from there.</p>
    <svg class="maccann" id="maccann" viewBox="0 0 1000 520" aria-label="Maccann duet keyboard"></svg>
  </section>

  <div class="status" id="status"></div>
</main>

<script src="concertina.js?v=V5"></script>
<script>
(() => {
  const { SVG_NS, ACC, spell, label, toMidi, buildMaccann, sampleFor, loopCache, playNote } = Concertina;
  const $ = id => document.getElementById(id);

  // ---------- the song ----------
  // Bars separated by |, notes as <note><octave>:<length in quarter notes>:<syllable>. Melody in C,
  // played with the right hand (its buttons run from C4 up).
  const SONG = {
    title: 'Hänschen klein', beatsPerBar: 4, hand: 'right',
    notes: `
      G4:1:Häns- E4:1:chen E4:2:klein | F4:1:ging D4:1:al- D4:2:lein | C4:1:in D4:1:die E4:1:wei- F4:1:te |
      G4:1:Welt G4:1:hi- G4:2:nein. | G4:1:Stock E4:1:und E4:2:Hut | F4:1:steht D4:1:ihm D4:2:gut, |
      C4:1:ist E4:1:gar G4:1:wohl- G4:1:ge- | C4:4:mut. | D4:1:A- D4:1:ber D4:1:Mut- D4:1:ter |
      D4:1:wei- E4:1:net F4:2:sehr, | E4:1:hat E4:1:ja E4:1:nun E4:1:kein | E4:1:Häns- F4:1:chen G4:2:mehr. |
      G4:1:Da E4:1:be- E4:2:sinnt | F4:1:sich D4:1:das D4:2:Kind, | C4:1:eilt E4:1:nach G4:1:Haus G4:1:ge- |
      C4:4:schwind.`,
  };
  const bars = SONG.notes.trim().split('|').map(bar => bar.trim().split(/\s+/).map(tok => {
    const [note, beats, syllable] = tok.split(':');
    return { midi: toMidi(note), beats: Number(beats), syllable };
  }));
  const notes = [];
  let beat = 0;
  bars.forEach((bar, b) => bar.forEach(n => { notes.push(Object.assign(n, { bar: b, beat })); beat += n.beats; }));
  const totalBeats = beat;

  // Notation settings from the main page
  let flats = false, helm = true;
  try {
    const saved = JSON.parse(localStorage.getItem('noteListener.settings') || 'null');
    if (saved) { flats = !!saved.flats; helm = saved.helm !== false; }
  } catch { /* defaults */ }
  const noteName = m => label(spell(m, flats), helm);

  // ---------- score ----------
  const score = $('score');
  const S = 10;  // staff line distance
  function svgEl(name, attrs, parent = score, text) {
    const e = document.createElementNS(SVG_NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    parent.appendChild(e);
    return e;
  }

  // Lays the bars out in lines (fewer per line on narrow screens); notes are spaced by their length
  function drawScore() {
    score.textContent = '';
    const perLine = score.clientWidth && score.clientWidth < 560 ? 2 : 4;
    const W = perLine === 2 ? 400 : 760, LINE_H = 118, TOP = 40;
    const barW = (W - 10 - 66) / perLine;
    const lines = Math.ceil(bars.length / perLine);
    score.setAttribute('viewBox', `0 0 ${W} ${lines * LINE_H + 10}`);
    for (let l = 0; l < lines; l++) {
      const bottom = TOP + l * LINE_H + 4 * S;   // y of the bottom staff line (E4)
      for (let i = 0; i < 5; i++) svgEl('line', { class: 'l', x1: 8, x2: W - 10, y1: bottom - i * S, y2: bottom - i * S });
      svgEl('text', { class: 'glyph', x: 12, y: bottom - S, 'font-size': 4 * S }, score, '𝄞');
      if (l === 0) {
        svgEl('text', { class: 'meter', x: 46, y: bottom - 2 * S - 2 }, score, String(SONG.beatsPerBar));
        svgEl('text', { class: 'meter', x: 46, y: bottom - 2 }, score, '4');
      }
      const lineBars = bars.slice(l * perLine, (l + 1) * perLine);
      lineBars.forEach((bar, i) => {
        const x0 = 66 + i * barW, last = l * perLine + i === bars.length - 1;
        svgEl('line', { class: 'bar', x1: x0 + barW, x2: x0 + barW, y1: bottom - 4 * S, y2: bottom, 'stroke-width': last ? 3 : 1.4 });
        // Space by length, but less than proportionally, so short notes keep room for their syllables
        const units = bar.map(n => Math.sqrt(n.beats));
        const unitW = (barW - 30) / Math.max(units.reduce((a, u) => a + u, 0), 2.5);
        let x = x0 + 22 + (l === 0 && i === 0 ? 8 : 0);
        bar.forEach((n, k) => { drawNote(n, x, bottom); x += units[k] * unitW; });
      });
    }
    highlight(currentIdx);
  }

  function drawNote(n, x, bottom) {
    const sp = spell(n.midi, flats);
    const step = sp.octave * 7 + sp.letterIndex - (4 * 7 + 2);  // 0 = E4 on the bottom line
    const y = bottom - step * S / 2;
    const g = svgEl('g', { class: 'note' });
    n.el = g;
    svgEl('rect', { class: 'hit', x: x - 14, y: bottom - 6 * S, width: 28, height: 10 * S }, g);
    for (let st = -2; st >= step; st -= 2) {
      svgEl('line', { class: 'ledger', x1: x - 11, x2: x + 11, y1: bottom - st * S / 2, y2: bottom - st * S / 2 }, g);
    }
    if (sp.acc) svgEl('text', { class: 'glyph', x: x - 22, y, 'font-size': 4 * S }, g, ACC[sp.acc]);
    svgEl('ellipse', { class: 'head ' + (n.beats >= 2 ? 'open' : 'filled'), cx: x, cy: y, rx: 6.4, ry: 4.4,
      transform: `rotate(-20 ${x} ${y})` }, g);
    if (n.beats < 4) {  // whole notes have no stem; the melody stays below the middle line, so stems go up
      svgEl('line', { class: 'stem', x1: x + 5.8, x2: x + 5.8, y1: y - 1.5, y2: y - 3.5 * S }, g);
    }
    svgEl('text', { class: 'lyric', x, y: bottom + 3.3 * S }, g, n.syllable);
    g.addEventListener('click', () => play(notes.indexOf(n)));
  }

  // ---------- keyboard ----------
  const maccann = $('maccann');
  const buttons = buildMaccann(maccann);
  for (const b of buttons) {
    const sp = spell(b.midi, flats);
    b.t.textContent = label(sp, helm);
    b.g.querySelector('title').textContent = label(sp, !helm);
  }
  const buttonFor = midi => buttons.find(b => b.hand === SONG.hand && b.midi === midi) || buttons.find(b => b.midi === midi);
  const handName = { left: 'left hand', right: 'right hand' };

  let currentIdx = 0;
  function highlight(i) {
    currentIdx = i;
    notes.forEach((n, k) => n.el?.classList.toggle('now', k === i));
    // Keep the current note visible (above the sticky keyboard on phones)
    const r = notes[i].el?.getBoundingClientRect(), keys = document.querySelector('.keys').getBoundingClientRect();
    const visibleBottom = getComputedStyle(document.querySelector('.keys')).position === 'sticky' ? keys.top : innerHeight;
    if (playing && r && (r.top < 0 || r.bottom > visibleBottom)) scrollBy({ top: r.top - 60, behavior: 'smooth' });
    const now = notes[i], next = notes[i + 1];
    for (const b of buttons) {
      b.g.classList.toggle('on', b === buttonFor(now.midi));
      b.g.classList.toggle('fits', !!next && b === buttonFor(next.midi) && next.midi !== now.midi);
    }
    const nowName = noteName(now.midi);
    $('nowNote').textContent = nowName;
    $('nextNote').textContent = `${handName[buttonFor(now.midi).hand]}` + (next ? ` · next: ${noteName(next.midi)}` : ' · last note');
  }

  // ---------- playback ----------
  let ctx = null, out = null, getLoop = null, voices = [], startTime = 0, startBeat = 0, rafId = 0, playing = false;
  const tempoInput = $('tempo');
  const secPerBeat = () => 60 / Number(tempoInput.value);

  async function play(from = 0) {
    stop();
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      out = ctx.createDynamicsCompressor();
      out.connect(ctx.destination);
      getLoop = loopCache(ctx);
    }
    if (ctx.state !== 'running') await ctx.resume();
    playing = true;
    $('play').textContent = '■ Stop';
    $('play').classList.add('listening');
    $('status').textContent = 'Loading…';
    const todo = notes.slice(from);
    let sounds;
    try {
      sounds = await Promise.all(todo.map(async n => {
        const { file, rate } = sampleFor(buttonFor(n.midi));
        return { buffer: await getLoop(file), rate };
      }));
    } catch {
      $('status').textContent = location.protocol === 'file:'
        ? 'Playing needs the page served over http: in the folder run python3 -m http.server, then open http://localhost:8000/song.html'
        : 'Could not load the recordings.';
      return stop();
    }
    if (!playing) return;
    $('status').textContent = '';
    const spb = secPerBeat();
    startBeat = todo[0].beat;
    startTime = ctx.currentTime + 0.1;
    todo.forEach((n, k) => {
      const t = startTime + (n.beat - startBeat) * spb;
      // Notes are slightly detached, so repeated notes are heard as separate notes
      const end = t + n.beats * spb - Math.min(0.08, n.beats * spb * 0.15);
      voices.push(playNote(ctx, out, sounds[k].buffer, sounds[k].rate, t, end));
    });
    const tick = () => {
      if (!playing) return;
      const beatNow = startBeat + (ctx.currentTime - startTime) / spb;
      if (beatNow >= totalBeats) { stop(); highlight(0); return; }
      let i = notes.findIndex(n => beatNow < n.beat + n.beats);
      if (beatNow < startBeat) i = notes.indexOf(todo[0]);
      if (i !== currentIdx) highlight(i);
      rafId = requestAnimationFrame(tick);
    };
    highlight(notes.indexOf(todo[0]));
    tick();
  }

  function stop() {
    playing = false;
    cancelAnimationFrame(rafId);
    for (const { src, gain } of voices) {
      gain.gain.cancelScheduledValues(ctx.currentTime);
      gain.gain.setTargetAtTime(0, ctx.currentTime, 0.02);
      try { src.stop(ctx.currentTime + 0.1); } catch { /* not started yet */ }
    }
    voices = [];
    $('play').textContent = '▶ Play';
    $('play').classList.remove('listening');
  }

  $('play').onclick = () => (playing ? stop() : play(currentIdx));
  document.addEventListener('keydown', e => {
    if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('play').click(); }
  });

  // Tempo, remembered in this browser
  const showTempo = () => { $('tempoValue').textContent = `${tempoInput.value} bpm`; };
  try { const t = Number(localStorage.getItem('noteListener.songTempo')); if (t) tempoInput.value = t; } catch { }
  showTempo();
  tempoInput.addEventListener('input', showTempo);
  tempoInput.addEventListener('change', () => {
    try { localStorage.setItem('noteListener.songTempo', tempoInput.value); } catch { }
    if (playing) play(currentIdx);  // continue at the new tempo
  });

  drawScore();
  addEventListener('resize', () => {
    const perLine = score.clientWidth < 560 ? 2 : 4;
    if (perLine !== (score.viewBox.baseVal.width === 400 ? 2 : 4)) drawScore();
  });
})();
</script>
</body>
</html>
