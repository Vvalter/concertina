<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note Listener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Music&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1;
    --panel: #ffffff;
    --ink: #1d1d1f;
    --muted: #6b6b70;
    --line: #d9d7d0;
    --accent: #2f6fdb;
    --good: #1f9d55;
    --warn: #d98a1f;
    --bad: #d2463c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --panel: #1e1e22;
      --ink: #ececef;
      --muted: #9a9aa2;
      --line: #36363c;
      --accent: #6b9dff;
      --good: #3ecf7a;
      --warn: #f0a940;
      --bad: #ff6b5f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  .update {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 14px; border-radius: 12px; background: var(--accent); color: #fff;
  }
  .update[hidden] { display: none; }
  .update button {
    border: 0; border-radius: 8px; padding: 6px 14px; font: inherit; font-weight: 600;
    background: #fff; color: var(--accent); cursor: pointer;
  }
  h1 .version { font-size: 0.75rem; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; vertical-align: middle; margin-left: 6px; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; color: var(--muted); }
  .controls label { display: flex; align-items: center; gap: 6px; }
  .controls input[type=number] {
    width: 4.5em; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--ink); font: inherit;
  }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    border: 0; background: var(--panel); color: var(--muted); padding: 4px 12px; font: inherit; cursor: pointer;
  }
  .seg button[aria-pressed=true] { background: var(--accent); color: #fff; }
  button.start {
    border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 600;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.start.listening { background: var(--bad); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px;
  }
  .display { display: grid; grid-template-columns: 1fr 1.3fr; gap: 20px; align-items: center; }
  @media (max-width: 560px) { .display { grid-template-columns: 1fr; } }
  .name { text-align: center; transition: opacity 0.3s; }
  .name.stale { opacity: 0.35; }
  .letter { font-size: clamp(5rem, 22vw, 8.5rem); font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  .letter .acc { font-family: "Noto Music", system-ui, sans-serif; font-size: 0.6em; font-weight: 400; vertical-align: 0.55em; }
  .letter .primes { font-size: 0.6em; font-weight: 600; vertical-align: 0.55em; letter-spacing: 0.02em; }
  .letter sub { font-size: 0.35em; font-weight: 500; color: var(--muted); vertical-align: baseline; margin-left: 0.05em; }
  .letter.chord { font-size: clamp(3.2rem, 14vw, 5.5rem); }
  .letter .qual { font-size: 0.5em; font-weight: 600; margin-left: 0.04em; }
  .letter .bass { font-size: 0.5em; font-weight: 500; color: var(--muted); }
  .alt { color: var(--muted); min-height: 1.4em; }
  .freq { color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 4px; }
  svg.staff { width: 100%; height: auto; max-height: 340px; display: block; transition: opacity 0.3s; }
  svg.staff.stale { opacity: 0.35; }
  .staff .l { stroke: var(--ink); stroke-width: 1.2; }
  .staff .glyph { fill: var(--ink); font-family: "Noto Music", "Bravura", "Segoe UI Symbol", "Apple Symbols", serif; }
  .staff .head { fill: none; stroke: var(--ink); stroke-width: 2.6; }
  .staff .small { fill: var(--muted); font: italic 600 12px system-ui, sans-serif; }

  .meter { position: relative; height: 34px; margin-top: 6px; }
  .meter .track { position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 3px; background: var(--line); }
  .meter .zone { position: absolute; top: 12px; height: 10px; left: 45%; width: 10%; border-radius: 3px; background: var(--good); opacity: 0.25; }
  .meter .tick { position: absolute; top: 8px; width: 1px; height: 18px; background: var(--muted); }
  .meter .needle {
    position: absolute; top: 4px; width: 4px; height: 26px; margin-left: -2px; border-radius: 2px;
    background: var(--muted); left: 50%; transition: left 0.08s linear, background 0.2s;
  }
  .meter-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cents { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }

  .history { display: flex; gap: 6px; flex-wrap: wrap; min-height: 32px; }
  .history span {
    padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 0.9rem;
  }
  .history span:first-child { border-color: var(--accent); color: var(--accent); }
  .card h2 { font-size: 1rem; margin: 0 0 4px; font-weight: 600; }
  .card .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 12px; }
  svg.maccann { width: 100%; height: auto; display: block; transition: opacity 0.3s; }
  svg.maccann.stale { opacity: 0.45; }
  .maccann .btn circle { fill: var(--panel); stroke: var(--muted); stroke-width: 2; }
  .maccann .btn.accidental circle { fill: var(--line); }
  .maccann .btn text { fill: var(--ink); font: 600 17px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .maccann .btn.on circle { fill: var(--accent); stroke: var(--accent); }
  .maccann .btn.on text { fill: #fff; }
  .maccann .hand { fill: var(--muted); font: 600 20px system-ui, sans-serif; text-anchor: middle; }
  .maccann .air circle { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 3; }
  .maccann .air text { fill: var(--muted); font: 600 12px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .maccann .hint { fill: var(--muted); font: 16px system-ui, sans-serif; text-anchor: middle; }
  .practice-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 8px; font-size: 0.9rem; color: var(--muted); }
  .practice-bar select, .practice-bar button {
    padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit;
  }
  .practice-bar button { cursor: pointer; }
  .practice-bar button[hidden] { display: none; }
  .practice-msg { margin: 0 0 12px; font-weight: 600; min-height: 1.3em; }
  .practice-msg[hidden] { display: none; }
  .practice-msg.good { color: var(--good); }
  .practice-msg.bad { color: var(--bad); }
  .maccann.playable .btn { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .maccann.playable .btn:hover circle { stroke: var(--accent); }
  .maccann .btn.fits circle { stroke: var(--accent); stroke-dasharray: 6 4; }
  .maccann .btn.target circle { fill: color-mix(in srgb, var(--accent) 22%, var(--panel)); stroke: var(--accent); stroke-width: 5; }
  .maccann .btn.good circle { fill: var(--good); stroke: var(--good); }
  .maccann .btn.bad circle { fill: var(--bad); stroke: var(--bad); }
  .maccann .btn.good text, .maccann .btn.bad text { fill: #fff; }
  .status { color: var(--muted); font-size: 0.9rem; min-height: 1.3em; }
  .level { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .level div { height: 100%; width: 0; background: var(--accent); transition: width 0.05s linear; }
</style>
</head>
<body>
<main>
  <div class="update" id="update" hidden role="status">
    <span id="updateText">A new version is available.</span>
    <button id="updateReload">Reload</button>
  </div>
  <header>
    <h1>Note Listener <span class="version" id="version">V3</span></h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="Mode">
        <button id="btnListen" aria-pressed="true" title="Listen to the microphone">Microphone</button>
        <button id="btnPlay" aria-pressed="false" title="Tap a button on the diagram to hear it">Play buttons</button>
      </div>
      <div class="seg" role="group" aria-label="Accidentals">
        <button id="btnSharp" aria-pressed="true">Sharps ♯</button>
        <button id="btnFlat" aria-pressed="false">Flats ♭</button>
      </div>
      <div class="seg" role="group" aria-label="Octave notation">
        <button id="btnHelm" aria-pressed="true" title="Helmholtz: c' = eingestrichenes c">c'</button>
        <button id="btnSci" aria-pressed="false" title="Scientific: C4 = middle C">C4</button>
      </div>
      <div class="seg" role="group" aria-label="Chord detection">
        <button id="btnChords" aria-pressed="true">Notes + chords</button>
        <button id="btnNotesOnly" aria-pressed="false" title="Chord detection off">Notes only</button>
      </div>
      <label>A4 = <input id="a4" type="number" min="400" max="480" step="1" value="440"> Hz</label>
      <button id="start" class="start">Start listening</button>
    </div>
  </header>

  <section class="card">
    <div class="display">
      <div class="name stale" id="nameBox">
        <div class="letter" id="letter">–</div>
        <div class="alt" id="alt"></div>
        <div class="freq" id="freq">&nbsp;</div>
      </div>
      <svg class="staff stale" id="staff" viewBox="0 0 300 310" aria-label="Notes on staff"></svg>
    </div>

    <div class="meter" aria-hidden="true">
      <div class="track"></div>
      <div class="zone"></div>
      <div class="tick" style="left:0"></div>
      <div class="tick" style="left:25%"></div>
      <div class="tick" style="left:50%"></div>
      <div class="tick" style="left:75%"></div>
      <div class="tick" style="left:calc(100% - 1px)"></div>
      <div class="needle" id="needle"></div>
    </div>
    <div class="meter-labels"><span>−50¢</span><span class="cents" id="cents">&nbsp;</span><span>+50¢</span></div>
  </section>

  <section class="card">
    <h2>Maccann duet buttons</h2>
    <p class="sub" id="maccannInfo">Lachenal Edeophone, 55 keys (Nr. 2570).</p>
    <div class="practice-bar">
      <label for="practice">Akkord üben</label>
      <select id="practice"><option value="">– aus –</option></select>
      <button id="practiceOff" hidden title="Übung beenden (Esc)">× Beenden</button>
    </div>
    <p class="practice-msg" id="practiceMsg" hidden></p>
    <svg class="maccann stale" id="maccann" viewBox="0 0 1000 520" aria-label="Maccann duet keyboard"></svg>
  </section>

  <div class="level"><div id="level"></div></div>
  <div class="status" id="status">Press “Start listening” and allow microphone access.</div>
  <div class="history" id="history"></div>
</main>

<script>
(() => {
  // ---------- note naming ----------
  const LETTERS = 'CDEFGAB';
  // [letter index, accidental] per pitch class
  const SHARP_MAP = [[0,0],[0,1],[1,0],[1,1],[2,0],[3,0],[3,1],[4,0],[4,1],[5,0],[5,1],[6,0]];
  const FLAT_MAP  = [[0,0],[1,-1],[1,0],[2,-1],[2,0],[3,0],[4,-1],[4,0],[5,-1],[5,0],[6,-1],[6,0]];
  const ACC = { '-1': '♭', '0': '', '1': '♯' };

  function spell(midi, flats) {
    const pc = ((midi % 12) + 12) % 12;
    const octave = Math.floor(midi / 12) - 1;
    const [li, acc] = (flats ? FLAT_MAP : SHARP_MAP)[pc];
    // Helmholtz / German octave names: c = kleine Oktave (C3), c' = eingestrichen (C4),
    // c'' = zweigestrichen, C = große Oktave (C2), C₁ = Kontra, C₂ = Subkontra
    const helmLetter = octave >= 3 ? LETTERS[li].toLowerCase() : LETTERS[li];
    const primes = octave >= 4 ? "'".repeat(octave - 3) : '';
    const sub = octave <= 1 ? '₀₁₂₃'[2 - octave] || '' : '';
    return {
      letter: LETTERS[li], letterIndex: li, acc, octave,
      text: LETTERS[li] + ACC[acc] + octave,
      helmLetter, primes, sub,
      helmText: helmLetter + ACC[acc] + primes + sub,
    };
  }
  const label = (sp, helm) => helm ? sp.helmText : sp.text;

  // ---------- pitch detection (McLeod Pitch Method / NSDF) ----------
  const MIN_FREQ = 40, MAX_FREQ = 4200;

  function detectPitch(buf, sampleRate) {
    const n = buf.length;
    let rms = 0;
    for (let i = 0; i < n; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / n);

    const maxTau = Math.min(n >> 1, Math.floor(sampleRate / MIN_FREQ));
    const minTau = Math.max(2, Math.floor(sampleRate / MAX_FREQ));
    const nsdf = new Float32Array(maxTau + 1);
    for (let tau = 0; tau <= maxTau; tau++) {
      let acf = 0, m = 0;
      for (let j = 0, end = n - tau; j < end; j++) {
        const a = buf[j], b = buf[j + tau];
        acf += a * b;
        m += a * a + b * b;
      }
      nsdf[tau] = m > 0 ? (2 * acf) / m : 0;
    }

    // Collect the highest maximum between each pair of positive zero crossings,
    // skipping the lobe around tau = 0.
    const peaks = [];
    let tau = 1;
    while (tau < maxTau && nsdf[tau] > 0) tau++;
    let curMax = -Infinity, curIdx = -1;
    for (; tau < maxTau; tau++) {
      if (nsdf[tau] > 0) {
        if (nsdf[tau] > curMax && nsdf[tau] >= nsdf[tau - 1] && nsdf[tau] >= nsdf[tau + 1]) {
          curMax = nsdf[tau]; curIdx = tau;
        }
      } else if (curIdx >= 0) {
        peaks.push(curIdx); curMax = -Infinity; curIdx = -1;
      }
    }
    if (curIdx >= 0) peaks.push(curIdx);
    if (!peaks.length) return { rms, freq: 0, clarity: 0 };

    let highest = 0;
    for (const p of peaks) highest = Math.max(highest, nsdf[p]);
    const p = peaks.find(i => i >= minTau && nsdf[i] >= 0.9 * highest);
    if (p === undefined) return { rms, freq: 0, clarity: 0 };

    // Parabolic interpolation around the chosen peak
    const a = nsdf[p - 1], b = nsdf[p], c = nsdf[p + 1];
    const denom = a - 2 * b + c;
    const shift = denom !== 0 ? 0.5 * (a - c) / denom : 0;
    return { rms, freq: sampleRate / (p + shift), clarity: b };
  }

  // ---------- polyphonic note detection (for chords) ----------
  // Finds the sounding notes in a magnitude spectrum (dB, as from AnalyserNode). Working upwards,
  // each note's expected overtones are subtracted so they aren't mistaken for notes themselves.
  const POLY_LOW = 36, POLY_HIGH = 100;                  // C2 .. E7
  // [semitones above the fundamental, how loud that overtone may be relative to the fundamental]
  const OVERTONES = [[12, 2], [19, 1.5], [24, 0.8], [28, 0.5], [31, 0.4], [34, 0.3], [36, 0.25]];
  // Semitone positions of the 2nd-10th harmonics. On the Edeophone these can be up to ~13x louder
  // than the fundamental, so loudness alone can't separate a played note from an overtone.
  const HARMONICS = [12, 19, 24, 28, 31, 34, 36, 38, 40];
  const OCTAVES_FIFTHS = new Set([12, 19, 24, 31, 36]);
  const noteFreq = (m, a4) => a4 * Math.pow(2, (m - 69) / 12);

  function detectNotes(db, sampleRate, fftSize, a4) {
    const binHz = sampleRate / fftSize;
    // Spectral peaks, each assigned to the nearest note if within 35 cents
    const amp = new Float32Array(POLY_HIGH + 40);
    const lo = Math.floor(noteFreq(POLY_LOW - 1, a4) / binHz);
    const hi = Math.min(db.length - 2, Math.ceil(noteFreq(POLY_HIGH + 37, a4) / binHz));
    for (let i = Math.max(1, lo); i <= hi; i++) {
      if (db[i] <= db[i - 1] || db[i] < db[i + 1]) continue;
      const denom = db[i - 1] - 2 * db[i] + db[i + 1];
      const f = (i + (denom ? 0.5 * (db[i - 1] - db[i + 1]) / denom : 0)) * binHz;
      const midiF = 69 + 12 * Math.log2(f / a4);
      const m = Math.round(midiF);
      if (Math.abs(midiF - m) > 0.35 || m < POLY_LOW || m >= amp.length) continue;
      amp[m] = Math.max(amp[m], Math.pow(10, db[i] / 20));
    }
    let maxAmp = 0;
    for (let m = POLY_LOW; m <= POLY_HIGH; m++) maxAmp = Math.max(maxAmp, amp[m]);
    if (maxAmp <= 0) return [];

    const residual = Float32Array.from(amp);
    const notes = [];
    for (let m = POLY_LOW; m <= POLY_HIGH; m++) {
      if (amp[m] < 0.03 * maxAmp) continue;
      // Every peak, even a weak one or one that is itself an overtone, explains the overtones above it
      // (a reed's fundamental can be quieter than its harmonics).
      for (const [iv, ratio] of OVERTONES) {
        if (m + iv < residual.length) residual[m + iv] = Math.max(0, residual[m + iv] - amp[m] * ratio);
      }
      if (residual[m] < 0.12 * maxAmp) continue;
      // Flag notes that sit on a harmonic of a lower peak (one not more than 20x quieter than this one)
      const note = { midi: m, amp: residual[m], overtone: false, octaveOrFifth: false };
      for (const iv of HARMONICS) {
        const p = m - iv;
        if (p < POLY_LOW || amp[p] < 0.03 * maxAmp || amp[p] < amp[m] / 20) continue;
        note.overtone = true;
        if (OCTAVES_FIFTHS.has(iv)) note.octaveOrFifth = true;
      }
      notes.push(note);
    }
    // Keep six, preferring notes that can't be overtones, then the strongest; return them in pitch order
    return notes.sort((a, b) => a.overtone - b.overtone || b.amp - a.amp).slice(0, 6).sort((a, b) => a.midi - b.midi);
  }

  // Chord from detectNotes() output, as { chord, midis }, or null. A single reed's harmonics spell a
  // dominant 7th chord on their own, so at least two pitch classes must come from notes that can't be
  // overtones. A played octave or fifth that coincides with a lower note's harmonic (e.g. G4 over C3)
  // is used only when the chord can't be completed without it.
  function findChord(notes) {
    const real = notes.filter(n => !n.overtone);
    if (new Set(real.map(n => n.midi % 12)).size < 2) return null;
    const chord = identifyChord(real.map(n => n.midi)) ||
      identifyChord(notes.filter(n => !n.overtone || n.octaveOrFifth).map(n => n.midi));
    if (!chord) return null;
    const pcs = new Set(chord.type.iv.map(i => (chord.root + i) % 12));
    return { chord, midis: notes.filter(n => !n.overtone || pcs.has(n.midi % 12)).map(n => n.midi) };
  }

  const CHORD_TYPES = [
    { suffix: '',     name: 'major',            iv: [0, 4, 7] },
    { suffix: 'm',    name: 'minor',            iv: [0, 3, 7] },
    { suffix: '7',    name: 'dominant 7th',     iv: [0, 4, 7, 10] },
    { suffix: 'maj7', name: 'major 7th',        iv: [0, 4, 7, 11] },
    { suffix: 'm7',   name: 'minor 7th',        iv: [0, 3, 7, 10] },
    { suffix: '6',    name: 'major 6th',        iv: [0, 4, 7, 9] },
    { suffix: 'm6',   name: 'minor 6th',        iv: [0, 3, 7, 9] },
    { suffix: 'dim',  name: 'diminished',       iv: [0, 3, 6] },
    { suffix: 'dim7', name: 'diminished 7th',   iv: [0, 3, 6, 9] },
    { suffix: 'm7♭5', name: 'half-diminished',  iv: [0, 3, 6, 10] },
    { suffix: 'aug',  name: 'augmented',        iv: [0, 4, 8] },
    { suffix: 'sus4', name: 'suspended 4th',    iv: [0, 5, 7] },
    { suffix: 'sus2', name: 'suspended 2nd',    iv: [0, 2, 7] },
    { suffix: '7sus4', name: '7th suspended 4th', iv: [0, 5, 7, 10] },
    { suffix: 'add9', name: 'added 9th',        iv: [0, 2, 4, 7] },
  ];

  // Best chord for a set of notes, or null. Allows one extra note, and a missing 5th in 4-note chords.
  function identifyChord(midis) {
    const pcs = new Set(midis.map(m => m % 12));
    if (pcs.size < 3) return null;
    const bass = midis[0] % 12;
    let best = null;
    for (const root of pcs) {
      for (const type of CHORD_TYPES) {
        const tpl = type.iv.map(i => (root + i) % 12);
        const missing = tpl.filter(pc => !pcs.has(pc));
        const extra = [...pcs].filter(pc => !tpl.includes(pc)).length;
        const matched = tpl.length - missing.length;
        if (matched < 3 || extra > 1) continue;
        if (missing.length && !(tpl.length === 4 && missing.length === 1 && missing[0] === (root + 7) % 12)) continue;
        const score = matched * 2 - extra * 1.5 - missing.length - (tpl.length - 3) * 0.1 + (root === bass ? 0.6 : 0);
        if (!best || score > best.score) best = { root, type, bass, score };
      }
    }
    if (!best) return null;
    return { ...best, key: `${best.root}${best.type.suffix}/${best.bass}` };
  }

  // ---------- staff rendering ----------
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const staff = document.getElementById('staff');
  const S = 12;                         // distance between staff lines
  const TREBLE_BOTTOM = 140, BASS_BOTTOM = 248;
  const X0 = 16, X1 = 284, NOTE_X = 204;

  function el(name, attrs, text) {
    const e = document.createElementNS(SVG_NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    staff.appendChild(e);
    return e;
  }

  // Grand staff: notes from middle C up go on the treble staff, lower ones on the bass staff.
  function drawStaff(midis, flats) {
    staff.textContent = '';
    for (const bottom of [TREBLE_BOTTOM, BASS_BOTTOM]) {
      for (let i = 0; i < 5; i++) {
        const y = bottom - i * S;
        el('line', { class: 'l', x1: X0, x2: X1, y1: y, y2: y });
      }
    }
    el('line', { class: 'l', x1: X0, x2: X0, y1: TREBLE_BOTTOM - 4 * S, y2: BASS_BOTTOM });
    // G clef curls around the G line; F clef dots straddle the F line (glyph origin sits below it)
    el('text', { class: 'glyph', x: X0 + 4, y: TREBLE_BOTTOM - S, 'font-size': 4 * S }, '𝄞');
    el('text', { class: 'glyph', x: X0 + 4, y: BASS_BOTTOM - 8, 'font-size': 4 * S }, '𝄢');
    if (!midis || !midis.length) return;

    const notes = midis.map(midi => {
      const treble = midi >= 60;
      // Very high notes are written an octave lower with an 8va mark
      const ottava = treble && midi >= 96;
      const sp = spell(ottava ? midi - 12 : midi, flats);
      const bottom = treble ? TREBLE_BOTTOM : BASS_BOTTOM;
      const ref = treble ? 4 * 7 + 2 /* E4 */ : 2 * 7 + 4 /* G2 */;
      const step = sp.octave * 7 + sp.letterIndex - ref;   // 0 = bottom line, 8 = top line
      return { sp, bottom, step, ottava, y: bottom - step * (S / 2), x: NOTE_X };
    });

    for (const bottom of [TREBLE_BOTTOM, BASS_BOTTOM]) {
      const group = notes.filter(n => n.bottom === bottom).sort((a, b) => a.step - b.step);
      if (!group.length) continue;
      // Seconds can't share a column: shift the upper note of each pair to the right
      for (let i = 1; i < group.length; i++) {
        if (group[i].step - group[i - 1].step === 1 && group[i - 1].x === NOTE_X) group[i].x = NOTE_X + 15;
      }
      const shifted = group.some(n => n.x !== NOTE_X);
      const lx1 = NOTE_X - 13, lx2 = NOTE_X + 13 + (shifted ? 15 : 0);
      const lo = group[0].step, hi = group[group.length - 1].step;
      for (let st = -2; st >= lo; st -= 2) {
        const ly = bottom - st * (S / 2);
        el('line', { class: 'l', x1: lx1, x2: lx2, y1: ly, y2: ly });
      }
      for (let st = 10; st <= hi; st += 2) {
        const ly = bottom - st * (S / 2);
        el('line', { class: 'l', x1: lx1, x2: lx2, y1: ly, y2: ly });
      }
    }

    // Whole-note heads
    for (const n of notes) {
      el('ellipse', { class: 'head', cx: n.x, cy: n.y, rx: 7.2, ry: 4.6, transform: `rotate(-22 ${n.x} ${n.y})` });
    }

    // Accidentals, from the top down, in the first column where they don't collide
    const columns = [];
    for (const n of notes.filter(n => n.sp.acc).sort((a, b) => a.y - b.y)) {
      let c = 0;
      while ((columns[c] || []).some(y => Math.abs(y - n.y) < 34)) c++;
      (columns[c] = columns[c] || []).push(n.y);
      el('text', { class: 'glyph', x: NOTE_X - 26 - c * 13, y: n.y, 'font-size': 4 * S }, ACC[n.sp.acc]);
    }

    const high = notes.filter(n => n.ottava);
    if (high.length) {
      const top = Math.min(...high.map(n => n.y), TREBLE_BOTTOM - 8 * S);
      el('text', { class: 'small', x: NOTE_X - 12, y: top - 16 }, '8va');
    }
  }

  // ---------- Maccann duet keyboard ----------
  // The owner's instrument: Lachenal Edeophone (Maccann system), 55 keys, Nr. 2570, traced from
  // Lachenal_Edeophone_55key_Nr2570-3.pdf. [x, y, note] in the PDF's coordinates (points);
  // the bottom of each hand is toward the hand rest. Chart octave marks: none = 4, ¹ = 5, ² = 6, ⁻¹ = 3.
  const MACCANN = {
    left: [
      [66.6,314.1,'G#4'], [66.6,370.8,'C#4'], [66.6,427.5,'G#3'], [66.6,484.2,'C#3'],
      [120.5,297.1,'G4'], [120.5,353.8,'C4'], [120.5,410.5,'G3'], [120.5,467.2,'C3'],
      [174.3,280.1,'B4'], [174.3,336.8,'E4'], [174.3,393.5,'A3'], [174.3,450.2,'E3'], [174.3,506.9,'Eb3'],
      [228.2,257.4,'Bb4'], [228.2,314.1,'A4'], [228.2,370.8,'D4'], [228.2,427.5,'Eb4'], [228.2,484.2,'D3'],
      [282.0,297.1,'C5'], [282.0,353.8,'F4'], [282.0,410.5,'B3'], [282.0,467.2,'F3'],
      [335.9,368.0,'F#4'], [335.9,424.7,'Bb3'], [335.9,481.4,'F#3'],
    ],
    right: [
      [506.0,257.4,'Eb6'], [506.0,314.1,'G#5'], [506.0,370.8,'C#5'], [506.0,427.5,'G#4'], [506.0,484.2,'C#4'],
      [559.8,240.4,'D6'], [559.8,297.1,'G5'], [559.8,353.8,'C5'], [559.8,410.5,'G4'], [559.8,467.2,'C4'],
      [613.7,223.4,'E6'], [613.7,280.1,'B5'], [613.7,336.8,'E5'], [613.7,393.5,'A4'], [613.7,450.2,'E4'], [613.7,506.9,'Eb4'],
      [667.6,257.4,'Bb5'], [667.6,314.1,'A5'], [667.6,370.8,'D5'], [667.6,427.5,'Eb5'], [667.6,484.2,'D4'],
      [721.4,240.4,'F6'], [721.4,297.1,'C6'], [721.4,353.8,'F5'], [721.4,410.5,'B4'], [721.4,467.2,'F4'],
      [775.3,311.3,'C#6'], [775.3,368.0,'F#5'], [775.3,424.7,'Bb4'], [775.3,481.4,'F#4'],
    ],
  };
  const AIR_BUTTON = [452, 506.6];
  const PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const toMidi = n => {
    const [, l, a, o] = n.match(/^([A-G])(#|b)?(\d)$/);
    return 12 * (+o + 1) + PC[l] + (a === '#' ? 1 : a === 'b' ? -1 : 0);
  };
  const maccann = document.getElementById('maccann');
  const maccannInfo = document.getElementById('maccannInfo');
  const maccannButtons = [];

  (function buildMaccann() {
    const svgEl = (name, attrs, parent = maccann) => {
      const e = document.createElementNS(SVG_NS, name);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      parent.appendChild(e);
      return e;
    };
    const X = x => (x - 20) * 1.25, Y = y => (y - 200) * 1.25 + 60;
    svgEl('text', { class: 'hand', x: X(201), y: 30 }).textContent = 'Left hand';
    svgEl('text', { class: 'hand', x: X(641), y: 30 }).textContent = 'Right hand';
    svgEl('text', { class: 'hint', x: X(201), y: 512 }).textContent = '↓ hand rest';
    svgEl('text', { class: 'hint', x: X(641), y: 512 }).textContent = '↓ hand rest';
    const air = svgEl('g', { class: 'air' });
    svgEl('circle', { cx: X(AIR_BUTTON[0]), cy: Y(AIR_BUTTON[1]), r: 20 }, air);
    svgEl('text', { x: X(AIR_BUTTON[0]), y: Y(AIR_BUTTON[1]) }, air).textContent = 'AIR';
    for (const hand of ['left', 'right']) {
      for (const [x, y, note] of MACCANN[hand]) {
        const midi = toMidi(note);
        const g = svgEl('g', { class: 'btn' + (note.length > 2 ? ' accidental' : '') });
        svgEl('circle', { cx: X(x), cy: Y(y), r: 27 }, g);
        const t = svgEl('text', { x: X(x), y: Y(y) }, g);
        svgEl('title', {}, g);
        maccannButtons.push({ midi, g, t, hand });
      }
    }
  })();

  function rangeText() {
    const ms = maccannButtons.map(b => b.midi);
    const ends = [Math.min(...ms), Math.max(...ms)].map(m => spell(m, useFlats));
    return `${ends.map(sp => sp.helmText).join('–')} / ${ends.map(sp => sp.text).join('–')}`;
  }

  function drawMaccann(midis) {
    if (practice) return drawPractice();
    const wanted = new Set(midis || []);
    const hands = new Map();
    for (const b of maccannButtons) {
      const sp = spell(b.midi, useFlats);
      b.t.textContent = label(sp, useHelm);
      b.g.querySelector('title').textContent = label(sp, !useHelm);
      const on = wanted.has(b.midi);
      b.g.classList.toggle('on', on);
      if (on) hands.set(b.midi, [...(hands.get(b.midi) || []), b.hand]);
    }
    if (!midis || !midis.length) return;
    const name = m => label(spell(m, useFlats), useHelm);
    const missing = midis.filter(m => !hands.has(m));
    const outOfRange = missing.length
      ? `${missing.map(name).join(' ')} ${missing.length > 1 ? 'are' : 'is'} not on this concertina (range ${rangeText()}).`
      : '';
    if (midis.length === 1) {
      const h = hands.get(midis[0]);
      maccannInfo.textContent = h ? `${name(midis[0])}: ${h.length > 1 ? 'left and right hand' : h[0] + ' hand'}` : outOfRange;
      return;
    }
    const where = midis.filter(m => hands.has(m))
      .map(m => `${name(m)} (${hands.get(m).map(h => h[0].toUpperCase()).join('+')})`).join(' · ');
    maccannInfo.textContent = [where, outOfRange].filter(Boolean).join(' — ');
  }

  // ---------- UI state ----------
  const $ = id => document.getElementById(id);
  const startBtn = $('start'), statusEl = $('status');
  const letterEl = $('letter'), altEl = $('alt'), freqEl = $('freq'), nameBox = $('nameBox');
  const needle = $('needle'), centsEl = $('cents'), levelEl = $('level'), historyEl = $('history');
  const a4Input = $('a4');

  let useFlats = false;
  let useHelm = true;
  let useChords = true;
  let current = null;   // { type: 'note', midi } or { type: 'chord', chord, midis }
  let practice = null;  // chord being practised, see startPractice()

  function setAccidentalMode(flats) {
    useFlats = flats;
    $('btnSharp').setAttribute('aria-pressed', String(!flats));
    $('btnFlat').setAttribute('aria-pressed', String(flats));
    render(current, true);
    renderHistory();
    saveSettings();
  }
  function setOctaveMode(helm) {
    useHelm = helm;
    $('btnHelm').setAttribute('aria-pressed', String(helm));
    $('btnSci').setAttribute('aria-pressed', String(!helm));
    render(current, true);
    renderHistory();
    saveSettings();
  }
  function setChordMode(on) {
    useChords = on;
    $('btnChords').setAttribute('aria-pressed', String(on));
    $('btnNotesOnly').setAttribute('aria-pressed', String(!on));
    if (!on && current?.type === 'chord') setStale();
    saveSettings();
  }
  $('btnChords').onclick = () => setChordMode(true);
  $('btnNotesOnly').onclick = () => setChordMode(false);
  $('btnHelm').onclick = () => setOctaveMode(true);
  $('btnSci').onclick = () => setOctaveMode(false);
  $('btnSharp').onclick = () => setAccidentalMode(false);
  $('btnFlat').onclick = () => setAccidentalMode(true);

  const pcName = pc => { const sp = spell(pc + 60, useFlats); return sp.letter + ACC[sp.acc]; };
  const chordName = c => pcName(c.root) + c.type.suffix + (c.bass !== c.root ? '/' + pcName(c.bass) : '');

  function render(sound, keepStale) {
    if (!sound) { drawStaff(null); drawMaccann(null); return; }
    if (sound.type === 'note') {
      const sp = spell(sound.midi, useFlats);
      const other = spell(sound.midi, !useFlats);
      const acc = sp.acc ? `<span class="acc">${ACC[sp.acc]}</span>` : '';
      letterEl.classList.remove('chord');
      letterEl.innerHTML = useHelm
        ? `${sp.helmLetter}${acc}${sp.primes ? `<span class="primes">${sp.primes}</span>` : ''}${sp.sub ? `<sub>${sp.sub}</sub>` : ''}`
        : `${sp.letter}${acc}<sub>${sp.octave}</sub>`;
      const parts = [];
      if (other.text !== sp.text) parts.push(`= ${label(other, useHelm)}`);
      parts.push(label(sp, !useHelm));
      altEl.textContent = parts.join(' · ');
      drawStaff([sound.midi], useFlats);
      drawMaccann([sound.midi]);
    } else {
      const { chord, midis } = sound;
      const root = spell(chord.root + 60, useFlats);
      letterEl.classList.add('chord');
      letterEl.innerHTML = `${root.letter}${root.acc ? `<span class="acc">${ACC[root.acc]}</span>` : ''}` +
        `<span class="qual">${chord.type.suffix}</span>` +
        (chord.bass !== chord.root ? `<span class="bass">/${pcName(chord.bass)}</span>` : '');
      altEl.textContent = `${pcName(chord.root)} ${chord.type.name} · ` +
        midis.map(m => label(spell(m, useFlats), useHelm)).join(' ');
      drawStaff(midis, useFlats);
      drawMaccann(midis);
    }
    if (!keepStale) {
      maccann.classList.remove('stale');
      nameBox.classList.remove('stale');
      staff.classList.remove('stale');
    }
  }

  function setStale() {
    nameBox.classList.add('stale');
    staff.classList.add('stale');
    if (!practice) maccann.classList.add('stale');
    clearTuning();
  }

  function clearTuning() {
    needle.style.background = 'var(--muted)';
    needle.style.left = '50%';
    centsEl.innerHTML = '&nbsp;';
    freqEl.innerHTML = '&nbsp;';
  }

  function showTuning(freq, cents) {
    freqEl.textContent = `${freq.toFixed(1)} Hz`;
    const c = Math.max(-50, Math.min(50, cents));
    needle.style.left = `${50 + c}%`;
    const abs = Math.abs(cents);
    needle.style.background = abs <= 5 ? 'var(--good)' : abs <= 15 ? 'var(--warn)' : 'var(--bad)';
    centsEl.textContent = `${cents > 0 ? '+' : ''}${Math.round(cents)}¢`;
  }

  const history = [];
  const soundKey = s => s.type === 'note' ? `n${s.midi}` : `c${s.chord.key}`;
  function pushHistory(sound) {
    if (history[0] && soundKey(history[0]) === soundKey(sound)) return;
    history.unshift(sound);
    if (history.length > 16) history.pop();
    renderHistory();
  }
  function renderHistory() {
    historyEl.textContent = '';
    for (const h of history) {
      const s = document.createElement('span');
      s.textContent = h.type === 'note' ? label(spell(h.midi, useFlats), useHelm) : chordName(h.chord);
      historyEl.appendChild(s);
    }
  }

  // ---------- chord practice ----------
  // Pick a chord; the diagram shows a suggested grip for each hand, and while playing, heard chord
  // tones turn green and other notes red.
  // [German name, root pitch class, CHORD_TYPES suffix, spelled with flats]
  const PRACTICE_CHORDS = [
    ['Dur', [['C-Dur', 0, ''], ['G-Dur', 7, ''], ['D-Dur', 2, ''], ['A-Dur', 9, ''], ['E-Dur', 4, ''],
             ['F-Dur', 5, '', true], ['B-Dur', 10, '', true], ['Es-Dur', 3, '', true]]],
    ['Moll', [['a-Moll', 9, 'm'], ['e-Moll', 4, 'm'], ['d-Moll', 2, 'm', true], ['h-Moll', 11, 'm'],
              ['g-Moll', 7, 'm', true], ['c-Moll', 0, 'm', true], ['f-Moll', 5, 'm', true], ['fis-Moll', 6, 'm']]],
    ['Septakkorde', [['C7', 0, '7', true], ['G7', 7, '7'], ['D7', 2, '7'], ['A7', 9, '7'], ['E7', 4, '7'],
                     ['F7', 5, '7', true], ['H7', 11, '7']]],
  ];
  const practiceSel = $('practice'), practiceMsg = $('practiceMsg');
  const MACCANN_INFO = maccannInfo.textContent;
  for (const [group, chords] of PRACTICE_CHORDS) {
    const og = document.createElement('optgroup');
    og.label = group;
    for (const [name] of chords) og.appendChild(new Option(name, name));
    practiceSel.appendChild(og);
  }

  function startPractice(name) {
    const entry = PRACTICE_CHORDS.flatMap(([, chords]) => chords).find(c => c[0] === name);
    if (!entry) return stopPractice();
    const [, root, suffix, flats = false] = entry;
    const type = CHORD_TYPES.find(t => t.suffix === suffix);
    // Suggested grip: root position, close voicing; left hand from octave 3, right hand from octave 4
    const grip = { left: type.iv.map(i => 48 + root + i), right: type.iv.map(i => 60 + root + i) };
    practice = {
      name, grip, flats,
      pcs: new Set(type.iv.map(i => (root + i) % 12)),
      targets: new Set(maccannButtons.filter(b => grip[b.hand].includes(b.midi))),
      heard: [],
    };
    practiceSel.value = name;
    $('practiceOff').hidden = false;
    practiceMsg.hidden = false;
    maccann.classList.remove('stale');
    showPracticeHint();
    drawPractice();
    saveSettings();
  }

  function stopPractice() {
    practice = null;
    practiceSel.value = '';
    $('practiceOff').hidden = true;
    practiceMsg.hidden = true;
    maccannInfo.textContent = MACCANN_INFO;
    for (const b of maccannButtons) b.g.classList.remove('target', 'fits', 'good', 'bad');
    drawMaccann(current?.type === 'note' ? [current.midi] : current?.midis);
    maccann.classList.toggle('stale', nameBox.classList.contains('stale'));
    saveSettings();
  }

  // In practice mode notes are spelled to suit the chord (fis-Moll: F♯ A C♯), not by the ♯/♭ switch
  const noteName = m => label(spell(m, practice.flats), useHelm);
  const practicePc = pc => { const sp = spell(pc + 60, practice.flats); return sp.letter + ACC[sp.acc]; };

  function showPracticeHint() {
    practiceMsg.className = 'practice-msg';
    practiceMsg.textContent = `${practice.name}: links ${practice.grip.left.map(noteName).join(' ')} · ` +
      `rechts ${practice.grip.right.map(noteName).join(' ')}`;
  }

  function drawPractice() {
    const { pcs, targets } = practice;
    const heard = new Set(practice.heard);
    // A heard chord tone lights the suggested button if it is one, otherwise every button with that note
    const heardTargets = new Set([...targets].filter(b => heard.has(b.midi)).map(b => b.midi));
    for (const b of maccannButtons) {
      const sp = spell(b.midi, practice.flats);
      b.t.textContent = label(sp, useHelm);
      b.g.querySelector('title').textContent = label(sp, !useHelm);
      const inChord = pcs.has(b.midi % 12);
      const isHeard = practice.heardButtons ? practice.heardButtons.has(b)
        : heard.has(b.midi) && (targets.has(b) || !heardTargets.has(b.midi));
      b.g.classList.remove('on');
      b.g.classList.toggle('target', targets.has(b));
      b.g.classList.toggle('fits', inChord && !targets.has(b));
      b.g.classList.toggle('good', isHeard && inChord);
      b.g.classList.toggle('bad', isHeard && !inChord);
    }
    maccannInfo.textContent = 'Blau: vorgeschlagener Griff · gestrichelt: passt auch · grün: richtig · rot: falsch';
  }

  // Called with each confirmed set of heard notes; an empty set (silence) keeps the last message.
  // Buttons are rarely released together, so while notes only drop out the verdict stays, and a
  // complete chord stays "Richtig" until a wrong note or silence. In play mode the exact buttons are
  // known (`buttons`), and the feedback follows them directly.
  function setPracticeHeard(midis, buttons = null) {
    if (!buttons && midis.length && midis.every(m => practice.heard.includes(m))) return;
    if (!buttons && practice.complete && midis.length && midis.every(m => practice.pcs.has(m % 12))) return;
    practice.heard = midis;
    practice.heardButtons = buttons;
    practice.complete = false;
    drawPractice();
    if (!midis.length) return;
    const wrong = midis.filter(m => !practice.pcs.has(m % 12));
    const got = new Set(midis.filter(m => practice.pcs.has(m % 12)).map(m => m % 12));
    const missing = [...practice.pcs].filter(pc => !got.has(pc));
    if (wrong.length) {
      practiceMsg.className = 'practice-msg bad';
      practiceMsg.textContent = `Falsch: ${wrong.map(noteName).join(' ')} gehört nicht zu ${practice.name}`;
    } else if (!missing.length) {
      practice.complete = true;
      practiceMsg.className = 'practice-msg good';
      practiceMsg.textContent = `Richtig! ${practice.name} ✓`;
    } else {
      practiceMsg.className = 'practice-msg';
      practiceMsg.textContent = `Gut so weit – es fehlt noch: ${missing.map(practicePc).join(' ')}`;
    }
  }

  practiceSel.onchange = () => (practiceSel.value ? startPractice(practiceSel.value) : stopPractice());
  $('practiceOff').onclick = stopPractice;
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && practice) stopPractice(); });

  // ---------- settings ----------
  // Remembered in this browser; storage can be unavailable (private mode), so failures are ignored
  const SETTINGS_KEY = 'noteListener.settings';
  let settingsLoaded = false;
  function saveSettings() {
    if (!settingsLoaded) return;
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({
        flats: useFlats, helm: useHelm, chords: useChords, a4: a4Input.value, practice: practice?.name || '',
        mode: playMode ? 'play' : 'listen',
      }));
    } catch { /* not remembered */ }
  }
  a4Input.addEventListener('change', saveSettings);

  drawStaff(null);
  drawMaccann(null);

  // ---------- audio ----------
  let ctx = null, stream = null, analyser = null, fftAnalyser = null, rafId = 0;

  async function start() {
    if (!navigator.mediaDevices?.getUserMedia) {
      statusEl.textContent = 'Microphone access is not available. Open this page over https:// or http://localhost.';
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
    } catch (err) {
      statusEl.textContent = `Could not access microphone: ${err.message || err.name}`;
      return;
    }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    src.connect(analyser);
    // Long window for chords: ~3 Hz resolution separates neighbouring low notes
    fftAnalyser = ctx.createAnalyser();
    fftAnalyser.fftSize = 16384;
    fftAnalyser.smoothingTimeConstant = 0.5;
    src.connect(fftAnalyser);
    startBtn.textContent = 'Stop';
    startBtn.classList.add('listening');
    statusEl.textContent = 'Listening… play a note or chord.';
    loop();
  }

  function stop() {
    cancelAnimationFrame(rafId);
    stream?.getTracks().forEach(t => t.stop());
    ctx?.close();
    ctx = stream = analyser = fftAnalyser = null;
    startBtn.textContent = 'Start listening';
    startBtn.classList.remove('listening');
    levelEl.style.width = '0';
    setStale();
    statusEl.textContent = 'Stopped.';
  }

  startBtn.onclick = () => (ctx ? stop() : start());

  // Detection smoothing
  const RMS_GATE = 0.01, CLARITY_GATE = 0.85, SILENCE_FRAMES = 12;
  const NOTE_CONFIRM = 3, CHORD_CONFIRM = 6;  // chords need longer: a note's release can briefly look like one
  // A clean single tone is very periodic; below this clarity we also look for chords
  const CHORD_CLARITY_MAX = 0.97;
  let candidateKey = null, candidateCount = 0, silentCount = 0;
  const recentFreqs = [];

  function confirm(key) {
    if (key === candidateKey) return ++candidateCount;
    candidateKey = key; candidateCount = 1; recentFreqs.length = 0;
    return 1;
  }

  function show(sound) {
    const changed = !current || soundKey(current) !== soundKey(sound) ||
      (sound.type === 'chord' && sound.midis.join() !== current.midis.join());
    if (changed || nameBox.classList.contains('stale')) {
      if (!current || soundKey(current) !== soundKey(sound) || nameBox.classList.contains('stale')) pushHistory(sound);
      current = sound;
      render(sound);
    }
  }

  // Practice mode: which notes are sounding. A clean single tone comes from the pitch detector, which
  // also handles reeds whose fundamental is too weak for detectNotes; anything else from detectNotes,
  // leaving out possible overtones. As in findChord, a chord tone on an octave/fifth harmonic (G4 over
  // C3) counts once two chord tones are clearly sounding.
  const PRACTICE_CONFIRM = 6;
  const buttonMidis = new Set(maccannButtons.map(b => b.midi));
  let practiceKey = null, practiceCount = 0, practiceSilent = 0;
  function practiceTick(rms, freq, clarity, a4, getNotes) {
    let heard = [];
    if (rms >= RMS_GATE) {
      const notes = getNotes();
      const real = notes.filter(n => !n.overtone).map(n => n.midi);
      const single = freq > 0 && (clarity >= CHORD_CLARITY_MAX ||
        (clarity >= CLARITY_GATE && new Set(real.map(m => m % 12)).size <= 1));
      const inChord = m => practice.pcs.has(m % 12);
      heard = single ? [Math.round(69 + 12 * Math.log2(freq / a4))]
        : new Set(real.filter(inChord).map(m => m % 12)).size >= 2
          ? notes.filter(n => !n.overtone || (n.octaveOrFifth && inChord(n.midi))).map(n => n.midi)
          : real;
      heard = heard.filter(m => buttonMidis.has(m));  // drop noise outside the instrument's range
    }
    if (!heard.length) {
      if (++practiceSilent === SILENCE_FRAMES) { practiceKey = null; setPracticeHeard([]); }
      return;
    }
    practiceSilent = 0;
    const key = heard.join();
    practiceCount = key === practiceKey ? practiceCount + 1 : 1;
    practiceKey = key;
    if (practiceCount === PRACTICE_CONFIRM) setPracticeHeard(heard);
  }

  function loop() {
    const buf = new Float32Array(analyser.fftSize);
    const spec = new Float32Array(fftAnalyser.frequencyBinCount);
    const tick = () => {
      analyser.getFloatTimeDomainData(buf);
      const { rms, freq, clarity } = detectPitch(buf, ctx.sampleRate);
      levelEl.style.width = `${Math.min(100, rms * 400)}%`;
      const a4 = Number(a4Input.value) || 440;

      let chord = null, midis = null, notes = null;
      const getNotes = () => notes ??= (fftAnalyser.getFloatFrequencyData(spec),
        detectNotes(spec, ctx.sampleRate, fftAnalyser.fftSize, a4));
      if (useChords && rms >= RMS_GATE && clarity < CHORD_CLARITY_MAX) {
        const found = findChord(getNotes());
        if (found) ({ chord, midis } = found);
      }

      if (chord) {
        silentCount = 0;
        if (confirm('c' + chord.key) >= CHORD_CONFIRM) {
          show({ type: 'chord', chord, midis });
          clearTuning();
          freqEl.textContent = 'Chord';
        }
      } else if (rms >= RMS_GATE && clarity >= CLARITY_GATE && freq > 0) {
        silentCount = 0;
        const midi = Math.round(69 + 12 * Math.log2(freq / a4));
        confirm('n' + midi);
        recentFreqs.push(freq);
        if (recentFreqs.length > 5) recentFreqs.shift();
        if (candidateCount >= NOTE_CONFIRM) {
          show({ type: 'note', midi });
          const med = [...recentFreqs].sort((x, y) => x - y)[recentFreqs.length >> 1];
          showTuning(med, 1200 * Math.log2(med / noteFreq(midi, a4)));
        }
      } else if (++silentCount === SILENCE_FRAMES) {
        candidateKey = null; candidateCount = 0;
        setStale();
      }
      if (practice) practiceTick(rms, freq, clarity, a4, getNotes);
      rafId = requestAnimationFrame(tick);
    };
    tick();
  }

  // ---------- update check ----------
  // GitHub Pages lets browsers cache the page for 10 minutes, so a plain reload can show an old
  // version. Fetching with cache: 'reload' bypasses the browser cache *and* stores the fresh copy,
  // so after a normal location.reload() the new version is what loads.
  const runningVersion = $('version').textContent.trim();
  let lastCheck = 0;

  async function checkForUpdate() {
    if (!/^https?:$/.test(location.protocol) || Date.now() - lastCheck < 60000) return;
    lastCheck = Date.now();
    try {
      const res = await fetch(location.href, { cache: 'reload' });
      if (!res.ok) return;
      const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
      const latest = doc.getElementById('version')?.textContent.trim();
      if (latest && latest !== runningVersion) {
        $('updateText').textContent = `A new version (${latest}) is available.`;
        $('update').hidden = false;
      }
    } catch { /* offline or blocked: keep running the current version */ }
  }
  $('updateReload').onclick = () => location.reload();
  checkForUpdate();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdate();
  });

  // ---------- play mode: tap a button to hear it ----------
  // One recording per button of the owner's Edeophone (samples/), named
  // <links|rechts>_Spalte<column>_<row>_<note><octave: none = 4, 1 = 5, 2 = 6, -1 = 3>.
  const SAMPLE_FILES = `links_Spalte1_1_C#-1 links_Spalte1_2_G#-1 links_Spalte1_3_C# links_Spalte1_4_G#
    links_Spalte2_1_C-1 links_Spalte2_2_G-1 links_Spalte2_3_C links_Spalte2_4_G links_Spalte3_1_Eb-1
    links_Spalte3_2_E-1 links_Spalte3_3_A-1 links_Spalte3_4_E links_Spalte3_5_B links_Spalte5_1_F-1
    links_Spalte5_2_B-1 links_Spalte5_3_F links_Spalte5_4_C1 links_Spalte6_1_F#-1 links_Spalte6_2_Bb-1
    links_Spalte6_3_F# rechts_Spalte1_1_C# rechts_Spalte1_2_G# rechts_Spalte1_3_C#1 rechts_Spalte1_4_G#1
    rechts_Spalte1_5_Eb2 rechts_Spalte2_1_C rechts_Spalte2_2_G rechts_Spalte2_3_C1 rechts_Spalte2_4_G1
    rechts_Spalte2_5_D2 rechts_Spalte3_1_Eb rechts_Spalte3_2_E rechts_Spalte3_3_A rechts_Spalte3_4_E1
    rechts_Spalte3_5_B1 rechts_Spalte3_6_E2 rechts_Spalte4_1_D rechts_Spalte4_2_Eb1 rechts_Spalte4_3_D1
    rechts_Spalte4_4_A1 rechts_Spalte4_5_Bb1 rechts_Spalte5_1_F rechts_Spalte5_2_B rechts_Spalte5_3_F1
    rechts_Spalte5_4_C2 rechts_Spalte5_5_F2 rechts_Spalte6_1_F# rechts_Spalte6_2_Bb rechts_Spalte6_3_F#1
    rechts_Spalte6_4_C#2`.split(/\s+/).map(name => {
      const [hand, , , note] = name.split('_');
      const [, n, oct] = note.match(/^([A-G][#b]?)(-?\d)?$/);
      return { name, hand: hand === 'links' ? 'left' : 'right', midi: toMidi(n + (4 + Number(oct || 0))) };
    });
  // Buttons without their own recording use the same note from the other hand, or else the nearest
  // recording of the same hand, re-pitched.
  function sampleFor(b) {
    const same = SAMPLE_FILES.find(f => f.hand === b.hand && f.midi === b.midi) ||
      SAMPLE_FILES.find(f => f.midi === b.midi);
    if (same) return { file: same, rate: 1 };
    const near = SAMPLE_FILES.filter(f => f.hand === b.hand)
      .sort((x, y) => Math.abs(x.midi - b.midi) - Math.abs(y.midi - b.midi))[0];
    return { file: near, rate: Math.pow(2, (b.midi - near.midi) / 12) };
  }

  let playMode = false, playCtx = null, playOut = null;
  const loops = new Map();    // file name -> Promise<AudioBuffer> of a seamless loop
  const playing = new Map();  // button -> { src, gain }

  // A loop from a recording: the longest steady stretch (attack and release cut off), its loudness
  // evened out so the loop doesn't swell at each repeat, and a loop point where the waveform best
  // matches the start, cross-faded over 80 ms. Returns samples normalised to the same loudness.
  function makeLoop(x, sr) {
    const hop = Math.round(sr * 0.01), win = Math.round(sr * 0.05);
    const env = [];
    for (let i = 0; i + win <= x.length; i += hop) {
      let e = 0;
      for (let j = i; j < i + win; j++) e += x[j] * x[j];
      env.push(Math.sqrt(e / win));
    }
    const peak = Math.max(...env);
    let run = [0, 0];
    for (let i = 0; i < env.length;) {
      if (env[i] < 0.6 * peak) { i++; continue; }
      let j = i;
      while (j < env.length && env[j] >= 0.6 * peak) j++;
      if (j - i > run[1] - run[0]) run = [i, j];
      i = j;
    }
    const s0 = (run[0] + 5) * hop, s1 = Math.min(x.length, (run[1] - 5) * hop + win, s0 + Math.round(sr * 1.3));
    const loudness = i => {  // envelope at sample i, interpolated between analysis windows
      const p = Math.max(0, (i - win / 2) / hop), k = Math.min(env.length - 1, Math.floor(p));
      const k2 = Math.min(env.length - 1, k + 1), f = Math.min(1, p - k);
      return Math.max(1e-4, env[k] * (1 - f) + env[k2] * f);
    };
    const y = new Float32Array(Math.max(0, s1 - s0));
    for (let i = 0; i < y.length; i++) y[i] = x[s0 + i] / loudness(s0 + i);

    const fade = Math.min(Math.round(sr * 0.08), Math.floor(y.length * 0.2));
    const maxLen = y.length - fade, minLen = Math.round(maxLen * 0.7);
    const match = (len, step) => {
      let ab = 0, aa = 0, bb = 0;
      for (let i = 0; i < fade; i += step) { const a = y[i], b = y[len + i]; ab += a * b; aa += a * a; bb += b * b; }
      return ab / Math.sqrt(aa * bb || 1);
    };
    let len = maxLen, best = -2;
    for (let L = minLen; L <= maxLen; L += 8) { const c = match(L, 4); if (c > best) { best = c; len = L; } }
    best = -2;
    for (let L = Math.max(minLen, len - 8), top = Math.min(maxLen, len + 8); L <= top; L++) {
      const c = match(L, 1); if (c > best) { best = c; len = L; }
    }

    const out = new Float32Array(len);
    let rms = 0;
    for (let i = 0; i < len; i++) {
      const w = i < fade ? i / fade : 1;
      out[i] = y[i] * w + (i < fade ? y[len + i] * (1 - w) : 0);
      rms += out[i] * out[i];
    }
    const gain = 0.12 / Math.sqrt(rms / len || 1);
    for (let i = 0; i < len; i++) out[i] *= gain;
    return out;
  }

  async function loadLoop(file) {
    const res = await fetch('samples/' + encodeURIComponent(file.name) + '.m4a');
    const buf = await playCtx.decodeAudioData(await res.arrayBuffer());
    const loop = makeLoop(buf.getChannelData(0), buf.sampleRate);
    const out = playCtx.createBuffer(1, loop.length, buf.sampleRate);
    out.copyToChannel(loop, 0);
    return out;
  }
  const getLoop = file => {
    if (!loops.has(file.name)) loops.set(file.name, loadLoop(file).catch(err => { loops.delete(file.name); throw err; }));
    return loops.get(file.name);
  };

  function ensurePlayCtx() {
    if (playCtx) return;
    playCtx = new (window.AudioContext || window.webkitAudioContext)();
    playOut = playCtx.createDynamicsCompressor();  // several buttons at once shouldn't clip
    playOut.connect(playCtx.destination);
  }

  async function toggleButton(b) {
    if (!playMode) return;
    ensurePlayCtx();
    if (playCtx.state !== 'running') playCtx.resume();
    if (playing.has(b)) {
      silence(b);
    } else {
      const { file, rate } = sampleFor(b);
      const entry = { src: playCtx.createBufferSource(), gain: playCtx.createGain() };
      playing.set(b, entry);
      showPlaying();
      let loop;
      try { loop = await getLoop(file); } catch {
        playing.delete(b);
        statusEl.textContent = location.protocol === 'file:'
          ? 'Could not load the recording: open the page via http://localhost (python3 -m http.server), not as a file.'
          : 'Could not load the recording for this button.';
        return showPlaying();
      }
      if (playing.get(b) !== entry) return;  // tapped again while loading
      entry.src.buffer = loop;
      entry.src.loop = true;
      entry.src.playbackRate.value = rate;
      entry.gain.gain.setValueAtTime(0, playCtx.currentTime);
      entry.gain.gain.setTargetAtTime(1, playCtx.currentTime, 0.01);
      entry.src.connect(entry.gain).connect(playOut);
      entry.src.start();
    }
    showPlaying();
  }

  function silence(b) {
    const { src, gain } = playing.get(b);
    playing.delete(b);
    gain.gain.setTargetAtTime(0, playCtx.currentTime, 0.02);
    if (src.buffer) src.stop(playCtx.currentTime + 0.15);
  }

  function stopAllButtons() {
    for (const b of [...playing.keys()]) silence(b);
    showPlaying();
  }

  // The note/chord display and the diagram follow the buttons that are sounding
  function showPlaying() {
    const buttons = [...playing.keys()];
    const midis = [...new Set(buttons.map(b => b.midi))].sort((x, y) => x - y);
    if (practice) setPracticeHeard(midis, new Set(buttons));
    if (!midis.length) {
      setStale();
      for (const b of maccannButtons) b.g.classList.remove('on');
      return;
    }
    const chord = midis.length > 2 && identifyChord(midis);
    current = chord ? { type: 'chord', chord, midis } : { type: 'note', midi: buttons.at(-1).midi };
    pushHistory(current);
    render(current);
    if (!chord) drawStaff(midis, useFlats);
    if (!practice) for (const b of maccannButtons) b.g.classList.toggle('on', playing.has(b));
    clearTuning();
  }

  function setPlayMode(on) {
    if (on === playMode) return;
    playMode = on;
    $('btnListen').setAttribute('aria-pressed', String(!on));
    $('btnPlay').setAttribute('aria-pressed', String(on));
    maccann.classList.toggle('playable', on);
    startBtn.hidden = on;
    if (on) {
      if (ctx) stop();
      ensurePlayCtx();
      for (const f of SAMPLE_FILES) getLoop(f).catch(() => {});  // preload in the background
      statusEl.textContent = location.protocol === 'file:'
        ? 'Playing needs the page served over http (browsers block loading the recordings from a file). ' +
          'In the folder run: python3 -m http.server, then open http://localhost:8000'
        : 'Tap a button on the diagram to play it, tap it again to stop.';
    } else {
      stopAllButtons();
      statusEl.textContent = 'Press “Start listening” and allow microphone access.';
    }
    saveSettings();
  }
  $('btnListen').onclick = () => setPlayMode(false);
  $('btnPlay').onclick = () => setPlayMode(true);
  for (const b of maccannButtons) b.g.addEventListener('click', () => toggleButton(b));

  // ---------- restore settings ----------
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
    if (saved) {
      if (typeof saved.flats === 'boolean') setAccidentalMode(saved.flats);
      if (typeof saved.helm === 'boolean') setOctaveMode(saved.helm);
      if (typeof saved.chords === 'boolean') setChordMode(saved.chords);
      if (saved.a4 && Number(saved.a4)) a4Input.value = saved.a4;
      if (saved.practice) startPractice(saved.practice);
      if (saved.mode === 'play') setPlayMode(true);
    }
  } catch { /* start with defaults */ }
  settingsLoaded = true;

  // Exposed for testing
  window.__detectPitch = detectPitch;
  window.__show = sound => { current = sound; render(sound); };
  window.__identifyChord = identifyChord;
  window.__checkForUpdate = () => { lastCheck = 0; return checkForUpdate(); };
})();
</script>
</body>
</html>
